services:

  api:
    build: .
    ports:
      - "8080:8080"

    depends_on:
      - db

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__con: "Server=db;Database=Dashboard;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "dashboard"
      Jwt__Audience: "dashboard"
      Jwt__AccessTokenExpiryMinutes: "1"
      Jwt__RefreshTokenExpiryDays: "7"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sql-data:/var/opt/mssql


volumes:
  sql-data: